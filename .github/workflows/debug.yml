name: Debug build

on:
  push:
    branches: [main, 17u-port, 17u-upstream-merge]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The NDK download (~1 GB) dominates setup: keep it between runs.
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/29.0.14206865
          key: ndk-29.0.14206865

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Explicit packages: the action's default list still names the removed
      # 'tools' package. Versions pinned in app/build.gradle.kts.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;29.0.14206865 cmake;3.31.6

      # native/image_scopes embeds its SPIR-V through `uv run`.
      - uses: astral-sh/setup-uv@v6

      - uses: gradle/actions/setup-gradle@v4

      # Compiler cache for the native code: unchanged C++ files are not rebuilt.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-arm64
          max-size: 2G

      # One Gradle run for both (shared configuration). Add [skip tests] to the
      # commit message to only assemble.
      - name: Unit tests + assemble debug APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # Hash the compiler by content (the NDK comes from a cache) and paths relative to the checkout.
          CCACHE_COMPILERCHECK: content
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
          SKIP_TESTS: ${{ contains(github.event.head_commit.message, '[skip tests]') }}
        run: |
          if [ "$SKIP_TESTS" = "true" ]; then
            ./gradlew :app:assembleDebug
          else
            ./gradlew :app:testDebugUnitTest :app:assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rawr-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Merges to main republish the `debug` prerelease so its download link
      # stays stable. PRs only keep the run artifact.
      - name: Publish debug prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rawr-debug.apk
          gh release delete debug --cleanup-tag --yes || true
          gh release create debug rawr-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Debug build" \
            --notes "Debug build of ${GITHUB_SHA::8}. Installs alongside release as Rawr Debug."

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
